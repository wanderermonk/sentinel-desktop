name: Build & Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            out: sentinel-desktop-linux
          - os: macos-latest
            out: sentinel-desktop-macos
          - os: windows-latest
            out: sentinel-desktop-windows.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip pyinstaller
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Build
        shell: bash
        run: pyinstaller --onefile --name sentinel-desktop app.py
      - name: Name the artifact
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            mv "dist/sentinel-desktop.exe" "dist/${{ matrix.out }}"
          else
            mv "dist/sentinel-desktop" "dist/${{ matrix.out }}"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.out }}
          path: dist/${{ matrix.out }}
  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          generate_release_notes: true
